<!DOCTYPE html>
<!-- Link curto para divulgar o YouTube: eulleraugusto.com.br/youtube
     Mostra a animação "Siga Euller Augusto no YouTube" e depois vai para o vídeo mais recente
     (quem descobre o vídeo é api/ultimo-video.js). -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euller Augusto no YouTube</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Assista ao vídeo mais recente do Euller Augusto, nutricionista, no YouTube.">
  <meta property="og:title" content="Euller Augusto no YouTube">
  <meta property="og:description" content="Assista ao vídeo mais recente do canal.">
  <meta property="og:image" content="https://www.eulleraugusto.com.br/img/yt-avatar.jpg">
  <meta name="theme-color" content="#2F3429">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --oliva: #2F3429; --oliva-2: #4A5140; --ouro: #B89A6A; --ouro-claro: #D9C49B; --creme: #FBF6EC; --vermelho: #ff0033; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; overflow: hidden; text-align: center; padding: 24px;
      font-family: 'Poppins', system-ui, sans-serif; color: var(--creme);
      background: radial-gradient(circle at 50% 38%, rgba(184,154,106,.28), transparent 50%), linear-gradient(165deg, #1d2018, var(--oliva) 55%, var(--oliva-2));
    }
    .palco { display: flex; flex-direction: column; align-items: center; max-width: 520px; }

    /* foto com anel dourado girando, e o selo do YouTube que pula em cima */
    .foto { position: relative; width: 150px; height: 150px; margin-bottom: 28px; animation: entrar .9s cubic-bezier(.2,1.4,.4,1) both; }
    .foto::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(var(--ouro), var(--ouro-claro), var(--oliva-2), var(--ouro)); animation: girar 3s linear infinite; }
    .foto img { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 5px solid var(--oliva); }
    .selo { position: absolute; right: -14px; bottom: 2px; width: 62px; height: 44px; border-radius: 14px; background: var(--vermelho); display: grid; place-items: center;
      box-shadow: 0 8px 22px rgba(255,0,51,.45); animation: pular .7s cubic-bezier(.2,1.6,.4,1) .6s both, pulso 1.4s ease-in-out 1.5s infinite; }
    .selo svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }

    .siga { font-size: .85rem; letter-spacing: .32em; text-transform: uppercase; color: var(--ouro-claro); font-weight: 600; animation: subir .7s ease .9s both; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1.1; margin: 10px 0 6px; animation: subir .7s ease 1.1s both; }
    h1 em { display: block; font-style: italic; font-weight: 600; font-size: .62em; color: var(--ouro-claro); }
    .serie { color: #d8cfbb; font-size: .95rem; animation: subir .7s ease 1.3s both; }

    /* barra que enche enquanto espera */
    .barra { width: 240px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; margin: 34px 0 12px; animation: subir .5s ease 1.4s both; }
    .barra span { display: block; height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--ouro), var(--ouro-claro)); transform-origin: left; animation: encher 2.4s linear 1.5s both; }
    .msg { font-size: .85rem; color: #bdb39c; animation: subir .5s ease 1.4s both; }
    .msg a { color: var(--ouro-claro); font-weight: 600; }

    @keyframes entrar { from { transform: scale(.4); opacity: 0; } }
    @keyframes girar { to { transform: rotate(360deg); } }
    @keyframes pular { from { transform: scale(0) rotate(-20deg); } }
    @keyframes pulso { 50% { transform: scale(1.1); box-shadow: 0 8px 30px rgba(255,0,51,.7); } }
    @keyframes subir { from { opacity: 0; transform: translateY(16px); } }
    @keyframes encher { from { transform: scaleX(0); } }
  </style>
</head>
<body>
  <main class="palco">
    <div class="foto">
      <img src="../img/yt-avatar.jpg" alt="Euller Augusto">
      <span class="selo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
    </div>
    <p class="siga">Siga no YouTube</p>
    <h1>Euller Augusto <em>nutricionista</em></h1>
    <p class="serie">Série <strong>Rumo aos 90 kg</strong> · um nutricionista emagrecendo de verdade</p>
    <div class="barra"><span></span></div>
    <p class="msg">Abrindo o vídeo mais recente… <a id="pular" href="/api/ultimo-video">assistir agora</a></p>
  </main>
  <script>
    // No site publicado, /api/ultimo-video descobre o vídeo mais novo. Aberto direto do computador, vai para o canal.
    const destino = location.protocol === 'file:' ? 'https://www.youtube.com/@oeulleraugusto' : '/api/ultimo-video';
    document.getElementById('pular').href = destino;
    setTimeout(() => location.replace(destino), 4000);   // 1,5 s de entrada + 2,4 s da barra
  </script>
</body>
</html>
